<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuantPick · 历史回测</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1f2329; --muted:#8a9099; --line:#e6e8eb; --accent:#2b6de4; --red:#e23b3b; --green:#1aa260; --warn:#e08a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  nav.topnav { background:var(--card); border-bottom:1px solid var(--line); padding:0 16px; display:flex; gap:2px; flex-wrap:wrap; position:sticky; top:0; z-index:40; }
  nav.topnav a { text-decoration:none; color:var(--muted); font-size:13px; padding:11px 14px; border-bottom:2px solid transparent; }
  nav.topnav a:hover { color:var(--accent); }
  nav.topnav a.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px; }
  header h1 { font-size:18px; margin:0; }
  .wrap { max-width:1100px; margin:20px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h2 .tag { font-size:11px; font-weight:600; color:var(--accent); background:#eaf1fc; padding:2px 8px; border-radius:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .metric { background:var(--bg); border-radius:8px; padding:12px; }
  .metric .k { color:var(--muted); font-size:12px; }
  .metric .v { font-size:20px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .pos { color:var(--red); } .neg { color:var(--green); }
  .legend { font-size:12px; color:var(--muted); margin:6px 0 12px; display:flex; gap:14px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:4px; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; line-height:1.6; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  svg { width:100%; display:block; background:var(--bg); border-radius:8px; }
  .seg-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  .seg-table th, .seg-table td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); }
  .seg-table th:first-child, .seg-table td:first-child { text-align:left; }
  .seg-table th { color:var(--muted); font-weight:600; }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:10px 0 30px; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/">🏠 总览</a>
  <a href="/backtest" class="active">📉 回测</a>
  <a href="/factors">📊 因子</a>
  <a href="/us-etf">🌎 美股ETF</a>
  <a href="/methodology">⚙️ 方法论</a>
</nav>
<header>
  <h1>📉 历史回测 · 策略 vs 沪深300</h1>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="btn primary" onclick="loadData(false)">加载回测（演示）</button>
    <button class="btn" onclick="loadData(true)">加载真实数据</button>
    <span id="status" class="note" style="margin:0"></span>
  </div>

  <div class="card">
    <h2>净值曲线 <span class="tag" id="srcTag">--</span></h2>
    <svg id="btChart" viewBox="0 0 980 320" width="100%" height="320" preserveAspectRatio="none"></svg>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>策略净值</span>
      <span><i style="background:var(--muted)"></i>沪深300（基准）</span>
    </div>
    <div class="note" id="btNote"></div>
  </div>

  <div class="card">
    <h2>核心指标</h2>
    <div id="metrics" class="grid"></div>
    <div class="note">指标基于回测区间收益序列计算；真实数据需服务器连通行情接口。回测含真实交易约束（涨停买不到/跌停卖不出/T+1/相关性去重/市场状态仓位缩放），结果不代表未来收益。</div>
  </div>

  <div class="card">
    <h2>分段表现</h2>
    <table id="segTable" class="seg-table"><thead></thead><tbody></tbody></table>
    <div class="note">按回测区间等分若干段，观察策略在不同市场阶段的稳定性。</div>
  </div>

  <footer>QuantPick · 量化研究工具（回测为模拟结果，不构成投资建议）。</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

function drawNav(svg, nav, bench) {
  if (!nav || !nav.length) { svg.innerHTML = ''; return; }
  const W = 980, H = 320, padL = 48, padR = 12, padT = 14, padB = 22;
  const all = nav.map(p => p.value).concat(bench ? bench.map(p => p.value) : [1]);
  const lo = Math.min(...all), hi = Math.max(...all);
  const n = nav.length;
  const x = i => padL + (W - padL - padR) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
  let s = '';
  // 网格 + Y 轴刻度
  for (let g = 0; g <= 4; g++) {
    const v = lo + (hi - lo) * g / 4, yy = y(v);
    s += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#e6e8eb" stroke-width="1"/>`;
    s += `<text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="#8a9099">${v.toFixed(2)}</text>`;
  }
  // X 轴标签（首/中/尾）
  [0, Math.floor(n/2), n-1].forEach(i => {
    const p = nav[i];
    const lab = p.date ? p.date.slice(0,10) : ('D'+i);
    s += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#8a9099">${lab}</text>`;
  });
  // 基准线
  if (bench && bench.length) {
    s += `<polyline fill="none" stroke="#8a9099" stroke-width="1.5" points="` +
         bench.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ') + `"/>`;
  }
  // 策略线
  s += `<polyline fill="none" stroke="#2b6de4" stroke-width="2" points="` +
       nav.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ') + `"/>`;
  svg.innerHTML = s;
}

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  return (v*100).toFixed(2) + '%';
}
function fmtNum(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  return v.toFixed(2);
}

function renderMetrics(metrics) {
  const el = $('metrics');
  if (!metrics) { el.innerHTML = '<div class="note">无指标数据</div>'; return; }
  const order = [
    ['total_return','累计收益', true],
    ['bench_total_return','基准收益', true],
    ['excess_return','超额收益', true],
    ['annual_return','年化', true],
    ['max_drawdown','最大回撤', true],
    ['sharpe','夏普', false],
    ['win_rate','胜率', true],
  ];
  el.innerHTML = order.map(([k,label,pct]) => {
    const v = metrics[k];
    if (v === undefined || v === null) return '';
    const cls = (typeof v === 'number' && v >= 0) ? 'pos' : (typeof v === 'number' ? 'neg' : '');
    const val = pct ? fmtPct(v) : fmtNum(v);
    return `<div class="metric"><div class="k">${label}</div><div class="v ${cls}">${val}</div></div>`;
  }).join('');
}

function renderSegments(segments) {
  const head = $('segTable').querySelector('thead');
  const body = $('segTable').querySelector('tbody');
  if (!segments || !Object.keys(segments).length) {
    body.innerHTML = '<tr><td class="note">无分段数据</td></tr>'; return;
  }
  const keys = Object.keys(segments);
  head.innerHTML = '<tr><th>区间</th><th>累计收益</th><th>最大回撤</th><th>夏普</th></tr>';
  body.innerHTML = keys.map(k => {
    const s = segments[k];
    const tr = s.total_return>=0?'pos':'neg';
    return `<tr><td>${k}</td>` +
      `<td class="${tr}">${fmtPct(s.total_return)}</td>` +
      `<td class="neg">${fmtPct(s.max_drawdown)}</td>` +
      `<td>${fmtNum(s.sharpe)}</td></tr>`;
  }).join('');
}

async function loadData(real) {
  $('status').textContent = '加载中…';
  const url = '/api/backtest' + (real ? '?demo=0' : '?demo=1') + '&force=1';
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (d.empty) { $('status').textContent = d.message || '回测暂不可用'; return; }
    $('srcTag').textContent = real ? '真实数据' : '演示数据';
    drawNav($('btChart'), d.nav, d.bench_nav);
    renderMetrics(d.metrics);
    renderSegments(d.segments);
    const t = d.metrics && d.metrics.total_return;
    $('btNote').textContent = '策略累计收益 ' + fmtPct(t) +
      '，基准 ' + fmtPct(d.bench_total_return) + '。' +
      (real ? '（真实数据）' : '（合成演示数据，clone 即可预览）');
    $('status').textContent = '完成';
  } catch (e) {
    $('status').textContent = '加载失败：' + e.message;
  }
}

loadData(false);
</script>
</body>
</html>
