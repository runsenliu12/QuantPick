<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuantPick · 美股 ETF</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1f2329; --muted:#8a9099; --line:#e6e8eb; --accent:#2b6de4; --red:#e23b3b; --green:#1aa260; --warn:#e08a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  nav.topnav { background:var(--card); border-bottom:1px solid var(--line); padding:0 16px; display:flex; gap:2px; flex-wrap:wrap; position:sticky; top:0; z-index:40; }
  nav.topnav a { text-decoration:none; color:var(--muted); font-size:13px; padding:11px 14px; border-bottom:2px solid transparent; }
  nav.topnav a:hover { color:var(--accent); }
  nav.topnav a.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px; }
  header h1 { font-size:18px; margin:0; }
  .wrap { max-width:1100px; margin:20px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h2 .tag { font-size:11px; font-weight:600; color:var(--accent); background:#eaf1fc; padding:2px 8px; border-radius:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { color:var(--muted); font-weight:600; }
  .pos { color:var(--red); } .neg { color:var(--green); }
  .attr { color:var(--muted); font-size:12px; text-align:left; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; line-height:1.6; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:10px 0 30px; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/">🏠 总览</a>
  <a href="/backtest">📉 回测</a>
  <a href="/factors">📊 因子</a>
  <a href="/us-etf" class="active">🌎 美股ETF</a>
  <a href="/methodology">⚙️ 方法论</a>
</nav>
<header>
  <h1>🌎 美股 ETF 精选</h1>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="btn primary" onclick="loadData(false)">加载（演示）</button>
    <button class="btn" onclick="loadData(true)">尝试真实数据</button>
    <span id="status" class="note" style="margin:0"></span>
  </div>

  <div class="card">
    <h2>🌎 美股 ETF 精选 Top <span class="tag" id="srcTag">--</span></h2>
    <table id="tbl"><thead></thead><tbody></tbody></table>
    <div class="note">
      默认以合成演示数据展示面板形态；在 <code>config.json</code> 启用 <code>us_etf</code> 并安装 <code>yfinance</code> 后，可获取真实数据。
      展示动量、低波动、规模、流动性等因子贡献。仅供参考，不构成投资建议。
    </div>
  </div>

  <footer>QuantPick · 美股 ETF 精选（演示数据，不构成投资建议）。</footer>
</div>

<script>
const COLS = [
  ["rank","排名"],["code","代码"],["name","名称"],["score","分数"],
  ["position_pct","仓位%"],["stop_loss_pct","止损%"],
  ["ret_20","20日%"],["ret_60","60日%"],["vol_60","年化波动%"],["attr","因子贡献"]
];
const PCT_COLS = new Set(["ret_20","ret_60","vol_60"]);

function fmt(v, pct) {
  if (v === null || v === undefined || v === "") return "-";
  const n = Number(v);
  if (isNaN(n)) return v;
  if (pct) return (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
  return (n >= 0 ? "+" : "") + n.toFixed(2);
}

function render(tableId, rows, cols) {
  const tbl = document.getElementById(tableId);
  const thead = tbl.querySelector("thead");
  const tbody = tbl.querySelector("tbody");
  thead.innerHTML = "<tr>" + cols.map(c => `<th>${c[1]}</th>`).join("") + "</tr>";
  if (!rows || !rows.length) {
    tbody.innerHTML = '<tr><td class="note" colspan="' + cols.length + '">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    return "<tr>" + cols.map(c => {
      const k = c[0], v = r[k];
      let cls = "";
      if (PCT_COLS.has(k)) cls = v >= 0 ? "pos" : "neg";
      if (k === "attr") return `<td class="attr">${v || ""}</td>`;
      return `<td class="${cls}">${fmt(v, PCT_COLS.has(k))}</td>`;
    }).join("") + "</tr>";
  }).join("");
}

async function loadData(real) {
  $('status').textContent = '加载中…';
  const url = '/api/us_etf' + (real ? '?demo=0' : '?demo=1') + '&force=1';
  try {
    const r = await fetch(url);
    const d = await r.json();
    $('srcTag').textContent = d.source === 'real' ? '真实数据' : '演示数据';
    render('tbl', d.rows || [], COLS);
    $('status').textContent = '完成';
  } catch (e) {
    $('status').textContent = '加载失败：' + e.message;
  }
}
function $(id){ return document.getElementById(id); }
loadData(false);
</script>
</body>
</html>
